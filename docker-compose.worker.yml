services:
  postgres:
    image: postgres:14.18-alpine
    container_name: reacher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - reacher_postgres_data:/var/lib/postgresql/data
    networks:
      - reacher-local

  rabbitmq:
    image: rabbitmq:4.0.9-management-alpine
    container_name: reacher-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - reacher_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - reacher-local

  reacher:
    image: ${REACHER_IMAGE:-reacher-backend:patched}
    platform: linux/amd64
    container_name: reacher-check-email
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      RCH__BACKEND_NAME: ${RCH__BACKEND_NAME:-local-worker}
      RCH__HEADER_SECRET: ${RCH__HEADER_SECRET}
      RCH__FROM_EMAIL: ${RCH__FROM_EMAIL:-hello@localhost}
      RCH__HELLO_NAME: ${RCH__HELLO_NAME:-localhost}
      RCH__HTTP_HOST: 0.0.0.0
      RCH__WORKER__ENABLE: "true"
      RCH__WORKER__RABBITMQ__URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RCH__WORKER__RABBITMQ__CONCURRENCY: "5"
      RCH__STORAGE__POSTGRES__DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RCH__SMTP_TIMEOUT: "45"
      RCH__THROTTLE__MAX_REQUESTS_PER_SECOND: "1"
      RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE: "40"
      RCH__THROTTLE__MAX_REQUESTS_PER_DAY: "72000"
      RUST_LOG: reacher=info
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - reacher-local

volumes:
  reacher_postgres_data:
  reacher_rabbitmq_data:

networks:
  reacher-local:
    name: reacher-local
