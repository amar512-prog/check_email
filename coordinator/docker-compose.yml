services:
  coordinator:
    build: .
    container_name: mailcheck-coordinator
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - coordinator_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - reacher-local

volumes:
  coordinator_data:

networks:
  # Joins the local Reacher worker stack's network so the coordinator can
  # reach the worker as http://reacher-check-email:8080 without any host
  # port. Remove this network (and the service's reference to it) when the
  # coordinator runs on a box without a local worker.
  reacher-local:
    name: reacher-local
    external: true
